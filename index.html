<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOOV - Live</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
.top-bar{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:12px;background:rgba(0,0,0,0.8);z-index:10}
.profile-top{width:35px;height:35px;border-radius:50%;background:#ff0050}
.room-feed{padding-top:60px}
.user-card{position:relative;height:85vh;border-bottom:1px solid #222;display:flex;align-items:flex-end;padding:20px;background:linear-gradient(transparent, #000)}
.avatar-side{position:absolute;right:15px;bottom:120px;text-align:center}
.avatar{width:60px;height:60px;border-radius:50%;border:2px solid #fff;background:#444;display:block}
.plus-btn{width:22px;height:22px;background:#ff0050;border-radius:50%;margin:-10px auto 10px;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer}
.icon-btn{margin:15px 0;font-size:28px;cursor:pointer}
.love-btn{color:#ff0050}
.followed{background:#fff !important;color:#000}
.bottom-nav{position:fixed;bottom:0;width:100%;display:flex;justify-content:space-around;padding:12px;background:#000;border-top:1px solid #222}
</style>
</head>
<body>
<div class="top-bar">
<div>Following | <b>For You - GLOOV</b></div>

</div>

</div>

</div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

const socket = io(window.location.origin);

 el.innerText = el.innerText==='+' ? '✓' : '+';
